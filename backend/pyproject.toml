[project]
name = "bokbuzz"
version = "0.1.0"
description = "Bokbuzz – regnskapsplattform for taxi-ENK (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pyjwt[crypto]>=2.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-storage>=2.18",
  "google-genai>=1.30",
]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bokbuzz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
